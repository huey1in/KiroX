name: Native C++

on:
  push:
    branches: [future]
  pull_request:
    branches: [future]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: windows
            arch: win64_mingw
          - os: ubuntu-24.04
            host: linux
            arch: linux_gcc_64
          - os: macos-latest
            host: mac
            arch: clang_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install aqtinstall==3.3.0 cmake==3.31.6 ninja==1.11.1.3 cryptography==46.0.3
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libgl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: macOS crypto
        if: runner.os == 'macOS'
        run: brew list openssl@3 || brew install openssl@3
      - name: Install Qt
        run: |
          extractor=()
          if [ "$RUNNER_OS" = Windows ]; then
            extractor=(-E "C:/Program Files/7-Zip/7z.exe")
          fi
          python -m aqt install-qt ${{ matrix.host }} desktop 6.8.3 ${{ matrix.arch }} -O .tools/qt -m qtshadertools qtmultimedia --archives qtbase qtdeclarative qtsvg qttools --timeout 30 "${extractor[@]}"
      - name: Windows compiler
        if: runner.os == 'Windows'
        run: python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 -O .tools/qt --timeout 30
      - name: Configure
        run: |
          qt_root="$(python -c 'from pathlib import Path; print(next(Path(".tools/qt/6.8.3").glob("*/lib/cmake/Qt6/Qt6Config.cmake")).resolve().parents[3].as_posix())')"
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="$PWD/.tools/qt/Tools/mingw1310_64/bin:$PWD/.tools/qt/6.8.3/mingw_64/bin:$PATH"
            compiler="-DCMAKE_CXX_COMPILER=$PWD/.tools/qt/Tools/mingw1310_64/bin/g++.exe"
            cygpath -w "$PWD/.tools/qt/Tools/mingw1310_64/bin" >> "$GITHUB_PATH"
            cygpath -w "$qt_root/bin" >> "$GITHUB_PATH"
          else
            echo "$qt_root/bin" >> "$GITHUB_PATH"
          fi
          prefix="$qt_root"
          if [ "$RUNNER_OS" = macOS ]; then
            prefix="$prefix;$(brew --prefix openssl@3)"
          fi
          cmake --preset release "-DCMAKE_PREFIX_PATH=$prefix" ${compiler:-} -DKIROX_WARNINGS_AS_ERRORS=ON "-DKIROX_VERIFY_PYTHON=$(python -c 'import sys; print(sys.executable)')"
      - name: Build
        run: cmake --build --preset release --parallel 3
      - name: Test
        run: ctest --preset release
      - name: Install
        run: cmake --install out/release --prefix "$PWD/out/package"
      - name: Package Windows
        if: runner.os == 'Windows'
        run: cd out/release && cpack -G ZIP
      - name: Package Linux
        if: runner.os == 'Linux'
        run: cd out/release && cpack -G TGZ
      - name: Package macOS
        if: runner.os == 'macOS'
        run: cd out/release && cpack -G DragNDrop
      - uses: actions/upload-artifact@v4
        with:
          name: kirox-native-${{ matrix.os }}
          path: |
            out/release/KiroX-*.zip
            out/release/KiroX-*.tar.gz
            out/release/KiroX-*.dmg
          if-no-files-found: error
